<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08080b">
  <title>Lunaeis — мои ссылки</title>
  <style>
    * {box-sizing:border-box}
    :root {color-scheme:dark;--accent:#d1b1ff}
    body {margin:0;background:radial-gradient(ellipse at 70% 12%,#12101b 0,transparent 42%),#08080b;color:#f7f6fa;font:1rem/1.45 Inter,Arial,sans-serif}
    main {width:min(100% - 3rem,76rem);margin:auto;padding:1.5rem 0 4rem}
    .mast {display:flex;align-items:center;justify-content:space-between;padding-bottom:1rem;border-bottom:1px solid #2c2932}
    .wordmark {font-weight:900;letter-spacing:.16em;text-transform:uppercase}
    .mast a {color:#d9c4f2;text-underline-offset:4px;font-size:.9rem}
    header {padding:clamp(2.8rem,6vw,5rem) 0}
    h1 {margin:0;font-size:clamp(2.45rem,7.4vw,6.4rem);line-height:.96;letter-spacing:-.065em;text-transform:uppercase;font-weight:900}
    h1 span {display:block;color:var(--accent)}
    nav {display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1rem}
    .row {grid-column:span 2;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:stretch;background:#121117;border:1px solid #2b2834;color:inherit;border-radius:.5rem;text-decoration:none;text-align:left;font:inherit;cursor:pointer;padding:0}
    .row:nth-last-child(-n+2) {grid-column:span 3}
    .row:hover,.row:focus-visible {border-color:#a988ca}
    :focus-visible {outline:2px solid var(--accent);outline-offset:3px}
    .art {display:block;width:100%;height:clamp(8rem,13vw,11rem);background:radial-gradient(ellipse at 51% 64%,#393144,#1a1822 43%,#101015 81%);border-bottom:1px solid #35303c}
    .mesh {transform-origin:center;transition:transform .35s ease}
    .row:hover .mesh,.row:focus-visible .mesh {transform:scale(1.06)}
    @media(prefers-reduced-motion:reduce){.mesh {transition:none}}
    i {position:absolute;top:.75rem;left:.75rem;width:2rem;height:2rem;display:grid;place-items:center;border-radius:.45rem;background:#121016;border:1px solid #443b50;color:#dcc6fa}
    i svg {width:1.15rem;height:1.15rem;fill:currentColor}
    .row>span:first-of-type {padding:1rem 1.1rem}
    strong,small {display:block}
    strong {font-size:1.35rem;letter-spacing:-.035em;text-transform:uppercase;font-weight:850}
    small,.action {font: .875rem/1.6 Consolas,monospace;color:#c3b8d0}
    .action {position:absolute;bottom:1rem;right:1rem;font: .875rem/1.5 Inter,Arial,sans-serif;color:var(--accent)}
    @media(max-width:48rem){nav {grid-template-columns:repeat(2,minmax(0,1fr))}.row,.row:nth-last-child(-n+2){grid-column:span 1}.row:last-child{grid-column:1/-1}.action{position:static;margin:-.8rem 1.1rem .6rem}}
    @media(max-width:32rem){main{width:calc(100% - 2rem)}nav{gap:.65rem}.row>span:first-of-type{padding:.8rem}.action{margin:-.6rem .8rem .6rem}.art{height:7rem}strong{font-size:1.1rem}}
  </style>
</head>
